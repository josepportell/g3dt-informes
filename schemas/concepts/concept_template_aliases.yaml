# Concept → Template Placeholder Aliases
#
# Maps canonical concept_ids (from `report_variables.yaml`) to the template
# placeholder names that `automation/reference_extractor.py` writes into
# `validation/eva_reference_values.json`. The reference extractor walks the
# Jinja `templates/g3dt-jinja-template.docx` and stores Eva's reference
# values under the *placeholder* names — which often differ from the
# canonical concept_id (e.g. `architect_name` → `architect_name_upper`,
# `client_name` → `client`, `field_date` → `data_camp_text`).
#
# Both `automation/ai_pipeline/trace.py` (`_eva_value_for_concept`) and
# `scripts/ai_pipeline_pass_c_diff.py` consult this map after trying the
# canonical concept_id directly. Without this mapping, ~17 legitimate Eva
# references on a typical project are invisible to the comparator and
# top-1 accuracy is severely under-reported.
#
# Conventions:
#  - Each top-level key is a canonical concept_id (no `_upper`, `_lower`,
#    `_text` etc. variants — those go in the alias list).
#  - Empty list means there is genuinely no template placeholder for that
#    concept (typically visual concepts: `*_visual`).
#  - For table-nested concepts (rows inside `geotech_rows`, `dpsh_tests`,
#    `sondeig_tests`, `lab_tests`, `perm_rows`, `seismic_rows`), the Eva
#    extractor stores them as nested dicts in lists. They cannot be
#    looked up by a flat alias and are flagged in comments below; the
#    simple alias map skips them and the comparator returns no_eva_ref.
#
# Keep this file in sync when concept_ids change in
# `report_variables.yaml` or when template placeholders are renamed in
# `g3dt-jinja-template.docx`.

