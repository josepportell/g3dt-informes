[project]
name = "g3dt"
version = "0.7.0"
description = "G3DT - Automatització d'Informes Geotècnics"
requires-python = ">=3.11"
dependencies = [
    "docxtpl>=0.16",
    "xlrd>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.27.1",
    "anthropic>=0.40",
    "shapely>=2.0",
    "openpyxl>=3.1",
    "extract-msg>=0.55.0",
    "python-multipart>=0.0.9",
    "pymupdf4llm>=0.0.17",
    "pypandoc>=1.13",
    "imagehash>=4.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]

# Setuptools modern (pip ≥25) requires explicit package declaration when the
# project root has multiple top-level dirs that look like packages. Only
# `automation/` and `web/` are real Python packages here; the rest are data
# folders (templates/, schemas/, demo/, samples/, guides/, analysis/).
[tool.setuptools.packages.find]
include = ["automation*", "web*"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0",
    "pillow>=10.0",
]
